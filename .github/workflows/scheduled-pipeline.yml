name: Scheduled mock pipeline

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Optional processing date (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Test
        run: pytest -q
      - name: Run pipeline
        env:
          INPUT_DATE: ${{ inputs.as_of_date }}
        run: |
          args=(--source mock --seed 42)
          if [[ -n "${INPUT_DATE:-}" ]]; then args+=(--as-of-date "$INPUT_DATE"); fi
          python scripts/run_pipeline.py "${args[@]}"
      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: mock-pipeline-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/
            data/manifests/
            data/warehouse.duckdb
          if-no-files-found: error
          retention-days: 30
