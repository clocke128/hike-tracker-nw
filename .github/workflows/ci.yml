name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint and test
        run: |
          ruff check src scripts tests
          pytest -q
      - name: Exercise mock pipeline
        run: python scripts/run_pipeline.py --source mock --as-of-date 2026-01-15 --seed 42
