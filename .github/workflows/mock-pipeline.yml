name: Mock data pipeline

on:
  push:
    branches:
      - master

  schedule:
    # Daily at midnight UTC.
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Run mock pipeline
        run: |
          python scripts/run_pipeline.py \
            --source mock \
            --seed 42

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: mock-pipeline-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/
            data/manifests/
            data/warehouse.duckdb
          if-no-files-found: error
          retention-days: 30

